<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HireNest - Admin Dashboard" />
    <meta name="keywords" content="admin dashboard, job portal, management" />
    <meta name="author" content="HireNest" />
    <meta name="robots" content="index, follow" />

    <link rel="icon" type="image/x-icon" href="/assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <title>HireNest - Admin Dashboard</title>

    <style>
      :root {
  --primary-color: #2563eb;
  --secondary-color: #06b6d4;
  --dark-color: #0f172a;
  --light-color: #ffffff;
  --gray-color: #f8fafc;
  --text-color: #475569;
  --border-color: #e2e8f0;

  --gradient: linear-gradient(135deg, #2563eb, #06b6d4);

  --shadow-sm: 0 5px 15px rgba(15, 23, 42, 0.05);
  --shadow-md: 0 15px 35px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 25px 50px rgba(15, 23, 42, 0.15);

  --transition: all 0.3s ease;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

body {
  min-height: 100vh;

  display: flex;
  flex-direction: column;

  overflow-x: hidden;

  background:
    radial-gradient(circle at top left, rgba(37, 99, 235, 0.08), transparent 25%),
    radial-gradient(circle at bottom right, rgba(6, 182, 212, 0.08), transparent 25%),
    #f8fafc;

  color: var(--text-color);
}

/* NAVBAR */

.navbar {
  position: fixed;
  top: 0;
  left: 0;

  width: 100%;

  padding: 1rem 6%;

  display: flex;
  justify-content: space-between;
  align-items: center;

  background: rgba(255, 255, 255, 0.75);

  backdrop-filter: blur(18px);

  border-bottom: 1px solid rgba(255, 255, 255, 0.3);

  z-index: 1000;

  box-shadow: var(--shadow-sm);
}

.logo a {
  text-decoration: none;

  display: flex;
  align-items: center;

  font-size: 2rem;
  font-weight: 700;

  background: var(--gradient);

  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.logo img {
  border-radius: 8px;
}

/* LOGOUT BUTTON */

.logout-btn {
  padding: 0.85rem 1.8rem;

  border-radius: 50px;

  border: 2px solid var(--primary-color);

  color: var(--primary-color);

  text-decoration: none;

  font-weight: 600;

  display: flex;
  align-items: center;
  gap: 0.5rem;

  transition: var(--transition);
}

.logout-btn:hover {
  background: var(--gradient);

  color: white;

  border-color: transparent;

  transform: translateY(-2px);

  box-shadow: 0 12px 25px rgba(37, 99, 235, 0.22);
}

/* DASHBOARD */

.dashboard-container {
  flex: 1;

  width: 100%;
  max-width: 1400px;

  margin: auto;

  padding: 8rem 5% 4rem;
}

/* TITLE */

.dashboard-title {
  font-size: 3rem;
  font-weight: 700;

  text-align: center;

  margin-bottom: 3rem;

  background: var(--gradient);

  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* CARDS GRID */

.action-cards {
  display: grid;

  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));

  gap: 2rem;
}

/* CARD */

.action-card {
  position: relative;

  background: rgba(255, 255, 255, 0.78);

  backdrop-filter: blur(18px);

  border-radius: 30px;

  padding: 2.5rem 2rem;

  overflow: hidden;

  border: 1px solid rgba(255, 255, 255, 0.35);

  box-shadow: var(--shadow-md);

  transition: var(--transition);

  text-align: center;
}

.action-card::before {
  content: "";

  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 6px;

  background: var(--gradient);
}

.action-card:hover {
  transform: translateY(-10px);

  box-shadow: var(--shadow-lg);
}

/* ICON */

.card-icon {
  width: 90px;
  height: 90px;

  margin: auto auto 1.5rem;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 2.3rem;

  background: rgba(37, 99, 235, 0.08);

  color: var(--primary-color);

  transition: var(--transition);
}

.action-card:hover .card-icon {
  transform: scale(1.08) rotate(5deg);

  background: rgba(37, 99, 235, 0.12);
}

/* CARD TITLE */

.card-title {
  font-size: 1.5rem;
  font-weight: 700;

  color: var(--dark-color);

  margin-bottom: 1.5rem;
}

/* BUTTON */

.card-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  padding: 1rem 2rem;

  border-radius: 18px;

  background: var(--gradient);

  color: white;

  text-decoration: none;

  font-size: 1rem;
  font-weight: 600;

  transition: var(--transition);

  box-shadow: 0 12px 24px rgba(37, 99, 235, 0.18);
}

.card-btn:hover {
  transform: translateY(-3px);

  box-shadow: 0 18px 35px rgba(15, 23, 42, 0.16);
}

/* ALERT */

.alert-message {
  position: fixed;

  top: 100px;
  right: 20px;

  padding: 1rem 1.5rem;

  border-radius: 16px;

  display: flex;
  align-items: center;
  gap: 1rem;

  z-index: 1001;

  animation: slideIn 0.4s ease;

  box-shadow: var(--shadow-md);
}

.success {
  background: #dcfce7;
  color: #166534;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

.alert-close {
  background: none;
  border: none;

  font-size: 1.2rem;

  cursor: pointer;

  color: inherit;
}

/* FOOTER */

.footer {
  background: #0f172a;

  padding: 1.5rem 6%;

  margin-top: auto;
}

.footer-content {
  max-width: 1200px;
  margin: auto;
}

.footer-links {
  display: flex;
  justify-content: center;

  gap: 3rem;
}

.footer-links a {
  color: rgba(255, 255, 255, 0.8);

  text-decoration: none;

  transition: var(--transition);
}

.footer-links a:hover {
  color: white;
}

/* ANIMATION */

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateX(100%);
  }

  to {
    opacity: 1;
    transform: translateX(0);
  }
}

/* MOBILE */

@media (max-width: 768px) {
  .navbar {
    padding: 1rem;
  }

  .dashboard-container {
    padding: 7rem 1rem 3rem;
  }

  .dashboard-title {
    font-size: 2.2rem;
  }

  .action-cards {
    grid-template-columns: 1fr;
  }

  .footer-links {
    flex-direction: column;
    align-items: center;

    gap: 1rem;
  }

  .action-card {
    padding: 2rem 1.5rem;
  }
}
    </style>
  </head>
  <body>
    <div th:if="${session.success}" class="alert-message success">
      <span th:text="${session.success}"></span>
      <button
        class="alert-close"
        onclick="this.parentElement.style.display='none'"
      >
        ×
      </button>
      <th:block th:text="${@messageRemover.remove()}"></th:block>
    </div>
    <div th:if="${session.error}" class="alert-message error">
      <span th:text="${session.error}"></span>
      <button
        class="alert-close"
        onclick="this.parentElement.style.display='none'"
      >
        ×
      </button>
      <th:block th:text="${@messageRemover.remove()}"></th:block>
    </div>

    <nav class="navbar">
      <div class="logo">
        <a href="/admin/home">
          <img
            src="/assets/favicon.png"
            alt="HireNest Logo"
            style="width: 30px; height: 30px; margin-right: 10px"
          />
          HireNest Admin
        </a>
      </div>
      <a href="/logout" class="logout-btn"
        >Logout <i class="fas fa-sign-out-alt"></i
      ></a>
    </nav>

    <div class="dashboard-container">
      <h1 class="dashboard-title">Admin Dashboard</h1>

      <div class="action-cards">
        <div class="action-card">
          <i class="fas fa-tasks card-icon"></i>
          <h2 class="card-title">Manage Jobs</h2>
          <a href="/admin/manage-jobs" class="card-btn">View Jobs</a>
        </div>
      </div>
    </div>

    <footer class="footer">
      <div class="footer-content">
        <div class="footer-links">
          <a href="/about-us">About Us</a>
          <a href="/privacy-policy">Privacy Policy</a>
          <a href="/terms">Terms of Service</a>
        </div>
      </div>
    </footer>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const alerts = document.querySelectorAll(".alert-message");
        alerts.forEach((alert) => {
          setTimeout(() => {
            alert.style.display = "none";
          }, 2000);
        });
      });
    </script>
  </body>
</html>
