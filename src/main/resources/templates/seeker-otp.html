<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HireNest - Verify your account" />
    <meta
      name="keywords"
      content="otp verification, job portal, account verification"
    />
    <meta name="author" content="HireNest" />
    <meta name="robots" content="index, follow" />

    <link rel="icon" type="image/x-icon" href="/assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <title>HireNest - OTP Verification</title>

    <style>
     :root {
  --primary-color: #2563eb;
  --secondary-color: #06b6d4;
  --success-color: #16a34a;
  --danger-color: #dc2626;

  --dark-color: #0f172a;
  --light-color: #ffffff;
  --text-color: #475569;

  --gradient: linear-gradient(135deg, #2563eb, #06b6d4);

  --shadow-sm: 0 8px 20px rgba(15, 23, 42, 0.08);
  --shadow-md: 0 20px 45px rgba(15, 23, 42, 0.12);
  --shadow-lg: 0 30px 60px rgba(37, 99, 235, 0.18);

  --transition: all 0.3s ease;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;

  font-family: "Poppins", sans-serif;
}

body {
  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;

  overflow: hidden;

  background:
    linear-gradient(
      rgba(15, 23, 42, 0.72),
      rgba(15, 23, 42, 0.72)
    ),
    url("https://images.unsplash.com/photo-1521791136064-7986c2920216?q=80&w=2070&auto=format&fit=crop");

  background-size: cover;
  background-position: center;

  position: relative;
}

/* GLOW EFFECT */

body::before {
  content: "";

  position: absolute;

  width: 500px;
  height: 500px;

  background: rgba(37, 99, 235, 0.2);

  filter: blur(120px);

  top: -120px;
  left: -120px;

  border-radius: 50%;
}

body::after {
  content: "";

  position: absolute;

  width: 400px;
  height: 400px;

  background: rgba(6, 182, 212, 0.18);

  filter: blur(120px);

  bottom: -100px;
  right: -100px;

  border-radius: 50%;
}

/* OTP CONTAINER */

.otp-container {
  position: relative;
  z-index: 2;

  width: 100%;
  max-width: 470px;

  padding: 3rem 2.5rem;

  border-radius: 32px;

  background: rgba(255, 255, 255, 0.14);

  backdrop-filter: blur(22px);

  border: 1px solid rgba(255, 255, 255, 0.2);

  box-shadow: var(--shadow-lg);

  text-align: center;

  overflow: hidden;

  animation: fadeUp 0.7s ease;
}

.otp-container::before {
  content: "";

  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 7px;

  background: var(--gradient);
}

/* TITLE */

.otp-title {
  font-size: 2.4rem;
  font-weight: 700;

  margin-bottom: 2rem;

  color: white;

  line-height: 1.3;
}

/* ALERTS */

.alert-message {
  padding: 1rem 1.2rem;

  border-radius: 18px;

  margin-bottom: 1.5rem;

  font-size: 0.95rem;
  font-weight: 500;

  backdrop-filter: blur(10px);

  animation: fadeIn 0.4s ease;
}

.success {
  background: rgba(22, 163, 74, 0.14);

  color: #bbf7d0;

  border: 1px solid rgba(34, 197, 94, 0.25);
}

.error {
  background: rgba(220, 38, 38, 0.14);

  color: #fecaca;

  border: 1px solid rgba(239, 68, 68, 0.25);
}

/* FORM */

.otp-form {
  display: flex;
  flex-direction: column;

  gap: 1.5rem;
}

/* INPUT */

.otp-input {
  width: 100%;

  padding: 1.1rem 1.4rem;

  border-radius: 20px;

  border: 1px solid rgba(255, 255, 255, 0.15);

  background: rgba(255, 255, 255, 0.12);

  color: white;

  font-size: 1.5rem;
  font-weight: 600;

  text-align: center;

  letter-spacing: 8px;

  transition: var(--transition);
}

.otp-input::placeholder {
  color: rgba(255, 255, 255, 0.6);

  letter-spacing: 2px;

  font-size: 1rem;
}

.otp-input:focus {
  outline: none;

  border-color: rgba(255, 255, 255, 0.3);

  background: rgba(255, 255, 255, 0.18);

  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.18);
}

/* BUTTON */

.submit-btn {
  width: 100%;

  padding: 1rem;

  border: none;

  border-radius: 20px;

  background: var(--gradient);

  color: white;

  font-size: 1rem;
  font-weight: 600;

  cursor: pointer;

  transition: var(--transition);

  box-shadow: 0 12px 24px rgba(37, 99, 235, 0.25);
}

.submit-btn:hover {
  transform: translateY(-3px);

  box-shadow: 0 18px 35px rgba(37, 99, 235, 0.35);
}

/* RESEND LINK */

.resend-link {
  display: inline-block;

  margin-top: 1.6rem;

  color: #bfdbfe;

  text-decoration: none;

  font-size: 0.95rem;
  font-weight: 500;

  transition: var(--transition);
}

.resend-link:hover {
  color: white;

  transform: translateY(-2px);
}

/* ANIMATIONS */

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(40px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: scale(0.96);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* RESPONSIVE */

@media (max-width: 600px) {
  .otp-container {
    padding: 2.2rem 1.5rem;

    border-radius: 26px;
  }

  .otp-title {
    font-size: 2rem;
  }

  .otp-input {
    font-size: 1.3rem;

    letter-spacing: 5px;
  }
}
    </style>
  </head>
  <body>
    <div class="otp-container">
      <h1 class="otp-title">Verify Your Account</h1>

      <div th:if="${session.success}" class="alert-message success">
        <span th:text="${session.success}"></span>
        <th:block th:text="${@messageRemover.remove()}"></th:block>
      </div>
      <div th:if="${session.error}" class="alert-message error">
        <span th:text="${session.error}"></span>
        <th:block th:text="${@messageRemover.remove()}"></th:block>
      </div>

      <form action="/jobseeker/otp" method="post" class="otp-form">
        <input
          type="text"
          name="otp"
          class="otp-input"
          placeholder="Enter OTP"
          maxlength="6"
          required
        />
        <input type="hidden" name="id" th:value="${id}" />
        <button type="submit" class="submit-btn">Verify OTP</button>
      </form>

      <a th:href="'/jobseeker/resend-otp/'+${id}" class="resend-link"
        >Resend OTP</a
      >
    </div>
  </body>
</html>
