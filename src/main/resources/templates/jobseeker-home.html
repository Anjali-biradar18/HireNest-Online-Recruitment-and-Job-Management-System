<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HireNest - Job Seeker Dashboard" />
    <meta
      name="keywords"
      content="job search, career opportunities, job seeker"
    />
    <meta name="author" content="HireNest" />
    <meta name="robots" content="index, follow" />

    <link rel="icon" type="image/x-icon" href="/assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <title>HireNest - Job Seeker Dashboard</title>

    <style>
      :root {
  --primary-color: #2563eb;
  --secondary-color: #06b6d4;
  --dark-color: #0f172a;
  --dark-light: #1e293b;
  --light-color: #ffffff;
  --gray-color: #f8fafc;
  --text-color: #334155;
  --border-color: #e2e8f0;

  --gradient: linear-gradient(135deg, #2563eb, #06b6d4);

  --shadow-sm: 0 4px 10px rgba(15, 23, 42, 0.05);
  --shadow-md: 0 10px 30px rgba(15, 23, 42, 0.12);
  --shadow-lg: 0 20px 50px rgba(15, 23, 42, 0.2);

  --radius-sm: 12px;
  --radius-md: 18px;
  --radius-lg: 28px;

  --transition: all 0.3s ease;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

html {
  scroll-behavior: smooth;
}

body {
  line-height: 1.6;
  background: var(--gray-color);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

/* NAVBAR */

.navbar {
  position: fixed;
  top: 0;
  width: 100%;
  padding: 1rem 6%;

  display: flex;
  justify-content: space-between;
  align-items: center;

  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(15px);

  border-bottom: 1px solid rgba(255, 255, 255, 0.2);

  z-index: 1000;

  box-shadow: var(--shadow-sm);
}

.logo {
  font-size: 2rem;
  font-weight: 700;
}

.logo a {
  text-decoration: none;
  display: flex;
  align-items: center;

  background: var(--gradient);

  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.logo img {
  border-radius: 8px;
}

.logout-btn {
  background: transparent;
  color: var(--primary-color);

  border: 2px solid var(--primary-color);

  padding: 0.8rem 2rem;

  border-radius: 50px;

  text-decoration: none;

  font-weight: 600;

  display: flex;
  align-items: center;
  gap: 0.6rem;

  transition: var(--transition);
}

.logout-btn:hover {
  background: var(--gradient);
  color: white;
  border-color: transparent;

  transform: translateY(-2px);

  box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
}

/* DASHBOARD */

.dashboard-container {
  flex: 1;

  padding: 8rem 5% 4rem;

  max-width: 1300px;

  width: 100%;

  margin: auto;
}

.dashboard-title {
  font-size: 3rem;
  font-weight: 700;

  text-align: center;

  margin-bottom: 3rem;

  background: var(--gradient);

  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* SEARCH SECTION */

.search-section {
  background: rgba(255, 255, 255, 0.92);

  backdrop-filter: blur(14px);

  padding: 2rem;

  border-radius: var(--radius-lg);

  box-shadow: var(--shadow-md);

  margin-bottom: 3rem;

  position: relative;

  overflow: hidden;
}

.search-section::before {
  content: "";

  position: absolute;

  width: 250px;
  height: 250px;

  background: rgba(37, 99, 235, 0.05);

  border-radius: 50%;

  top: -100px;
  right: -80px;
}

.search-form {
  display: flex;
  gap: 1rem;

  position: relative;
  z-index: 2;
}

.search-input {
  flex: 1;

  padding: 1rem 1.5rem;

  border-radius: 16px;

  border: 1px solid var(--border-color);

  background: #f8fafc;

  font-size: 1rem;

  transition: var(--transition);
}

.search-input::placeholder {
  color: #94a3b8;
}

.search-input:focus {
  outline: none;

  border-color: var(--primary-color);

  background: white;

  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
}

/* BUTTON */

.card-btn {
  background: var(--gradient);

  color: white;

  padding: 1rem 2rem;

  border: none;

  border-radius: 16px;

  font-size: 1rem;
  font-weight: 600;

  cursor: pointer;

  text-decoration: none;

  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.7rem;

  transition: var(--transition);
}

.card-btn:hover {
  transform: translateY(-2px);

  box-shadow: 0 15px 30px rgba(37, 99, 235, 0.3);
}

/* CARDS */

.action-cards {
  display: grid;

  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));

  gap: 2rem;
}

.action-card {
  background: rgba(255, 255, 255, 0.95);

  backdrop-filter: blur(14px);

  padding: 2.5rem 2rem;

  border-radius: var(--radius-lg);

  text-align: center;

  position: relative;

  overflow: hidden;

  box-shadow: var(--shadow-md);

  transition: var(--transition);
}

.action-card::before {
  content: "";

  position: absolute;

  width: 220px;
  height: 220px;

  background: rgba(37, 99, 235, 0.05);

  border-radius: 50%;

  top: -100px;
  right: -100px;
}

.action-card:hover {
  transform: translateY(-10px);

  box-shadow: var(--shadow-lg);
}

.card-icon {
  width: 90px;
  height: 90px;

  margin: auto auto 1.5rem;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background: rgba(37, 99, 235, 0.1);

  color: var(--primary-color);

  font-size: 2.2rem;

  position: relative;
  z-index: 2;
}

.card-title {
  font-size: 1.4rem;
  font-weight: 700;

  color: var(--dark-color);

  margin-bottom: 1rem;

  position: relative;
  z-index: 2;
}

.action-card p {
  color: #64748b;

  margin-bottom: 1.5rem;

  position: relative;
  z-index: 2;
}

/* ALERT */

.alert-message {
  position: fixed;

  top: 100px;
  right: 20px;

  padding: 1rem 1.5rem;

  border-radius: 14px;

  z-index: 1001;

  animation: slideIn 0.5s ease-out;

  box-shadow: var(--shadow-md);
}

.success {
  background: #dcfce7;
  color: #166534;
  border-left: 5px solid #16a34a;
}

.error {
  background: #fee2e2;
  color: #991b1b;
  border-left: 5px solid #dc2626;
}

@keyframes slideIn {
  from {
    transform: translateX(100%);
    opacity: 0;
  }

  to {
    transform: translateX(0);
    opacity: 1;
  }
}

/* FOOTER */

.footer {
  background: var(--dark-color);

  padding: 1.5rem 6%;
}

.footer-content {
  max-width: 1200px;
  margin: auto;
}

.footer-links {
  display: flex;
  justify-content: center;
  gap: 3rem;
}

.footer-links a {
  color: rgba(255, 255, 255, 0.85);

  text-decoration: none;

  font-weight: 500;

  position: relative;

  transition: var(--transition);
}

.footer-links a::after {
  content: "";

  position: absolute;

  left: 0;
  bottom: -5px;

  width: 0%;
  height: 2px;

  background: var(--secondary-color);

  transition: var(--transition);
}

.footer-links a:hover {
  color: white;
}

.footer-links a:hover::after {
  width: 100%;
}

/* RESPONSIVE */

@media (max-width: 768px) {
  .dashboard-container {
    padding: 7rem 1rem 3rem;
  }

  .dashboard-title {
    font-size: 2.2rem;
  }

  .search-form {
    flex-direction: column;
  }

  .action-cards {
    grid-template-columns: 1fr;
  }

  .navbar {
    padding: 1rem;
  }

  .logout-btn {
    padding: 0.7rem 1.4rem;
    font-size: 0.9rem;
  }

  .footer-links {
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }
}
    </style>
  </head>

  <body>
    <nav class="navbar">
      <div class="logo">
        <a href="/jobseeker/home">
          <img
            src="/assets/favicon.png"
            alt="HireNest Logo"
            style="width: 30px; height: 30px; margin-right: 10px"
          />
          HireNest
        </a>
      </div>
      <a href="/logout" class="logout-btn"
        >Logout <i class="fas fa-sign-out-alt"></i
      ></a>
    </nav>

    <div class="dashboard-container">
      <h1 class="dashboard-title">Job Seeker Dashboard</h1>

      <div th:if="${session.success}" class="alert-message success">
        <span th:text="${session.success}"></span>
        <th:block th:text="${@messageRemover.remove()}"></th:block>
      </div>
      <div th:if="${session.error}" class="alert-message error">
        <span th:text="${session.error}"></span>
        <th:block th:text="${@messageRemover.remove()}"></th:block>
      </div>

      <div class="search-section">
        <form action="/search-jobs" method="post" class="search-form">
          <input
            type="text"
            name="query"
            class="search-input"
            placeholder="Search jobs by title, skills, or location..."
          />
          <button type="submit" class="card-btn">
            <i class="fas fa-search"></i> Search Jobs
          </button>
        </form>
      </div>

      <div class="action-cards">
        <div class="action-card" th:if="${!session.jobSeeker.completed}">
          <i class="fas fa-user-edit card-icon"></i>
          <h2 class="card-title">Complete Your Profile</h2>
          <a href="/jobseeker/complete-profile" class="card-btn"
            >Update Profile</a
          >
        </div>

        <div class="action-card">
          <i class="fas fa-briefcase card-icon"></i>
          <h2 class="card-title">Browse Jobs</h2>
          <a href="/jobseeker/view-jobs" class="card-btn">View All Jobs</a>
        </div>

        <div class="action-card">
          <i class="fas fa-file-alt card-icon"></i>
          <h2 class="card-title">My Applications</h2>
          <a href="/jobseeker/my-applications" class="card-btn"
            >View Applications</a
          >
        </div>
      </div>
    </div>

    <footer class="footer">
      <div class="footer-content">
        <div class="footer-links">
          <a href="/about-us">About Us</a>
          <a href="/privacy-policy">Privacy Policy</a>
          <a href="/terms">Terms of Service</a>
        </div>
      </div>
    </footer>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const alerts = document.querySelectorAll(".alert-message");
        alerts.forEach((alert) => {
          setTimeout(() => {
            alert.style.display = "none";
          }, 2000);
        });
      });
    </script>
  </body>
</html>
