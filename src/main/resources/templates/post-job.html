<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HireNest - Post a new job opportunity" />
    <meta
      name="keywords"
      content="post job, job listing, recruitment, hiring"
    />
    <meta name="author" content="HireNest" />
    <meta name="robots" content="index, follow" />

    <link rel="icon" type="image/x-icon" href="/assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <title>HireNest - Post New Job</title>

    <style>
      :root {
  --primary-color: #2563eb;
  --secondary-color: #06b6d4;
  --dark-color: #0f172a;
  --light-color: #ffffff;
  --gray-color: #f8fafc;
  --text-color: #475569;
  --border-color: #e2e8f0;

  --gradient: linear-gradient(135deg, #2563eb, #06b6d4);

  --shadow-sm: 0 4px 10px rgba(15, 23, 42, 0.05);
  --shadow-md: 0 10px 30px rgba(15, 23, 42, 0.1);
  --shadow-lg: 0 20px 45px rgba(15, 23, 42, 0.18);

  --radius-sm: 14px;
  --radius-md: 20px;
  --radius-lg: 28px;

  --transition: all 0.3s ease;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

body {
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;

  background: var(--gray-color);
}

/* NAVBAR */

.navbar {
  position: fixed;
  top: 0;
  width: 100%;

  padding: 1rem 6%;

  display: flex;
  justify-content: space-between;
  align-items: center;

  background: rgba(255, 255, 255, 0.9);

  backdrop-filter: blur(14px);

  z-index: 1000;

  border-bottom: 1px solid rgba(255, 255, 255, 0.2);

  box-shadow: var(--shadow-sm);
}

.logo {
  font-size: 2rem;
  font-weight: 700;

  transition: var(--transition);
}

.logo:hover {
  transform: scale(1.04);
}

.logo a {
  text-decoration: none;

  display: flex;
  align-items: center;

  background: var(--gradient);

  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.logo img {
  border-radius: 8px;
}

/* LOGOUT BUTTON */

.logout-btn {
  background: transparent;

  color: var(--primary-color);

  border: 2px solid var(--primary-color);

  padding: 0.8rem 2rem;

  border-radius: 50px;

  text-decoration: none;

  font-weight: 600;

  display: flex;
  align-items: center;
  gap: 0.5rem;

  transition: var(--transition);
}

.logout-btn:hover {
  background: var(--gradient);

  color: white;

  border-color: transparent;

  transform: translateY(-2px);

  box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
}

/* CONTAINER */

.post-job-container {
  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 8rem 1rem 3rem;

  background: linear-gradient(
      rgba(15, 23, 42, 0.72),
      rgba(15, 23, 42, 0.72)
    ),
    url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f?q=80&w=2071&auto=format&fit=crop");

  background-size: cover;
  background-position: center;
  background-attachment: fixed;

  position: relative;
}

.post-job-container::before {
  content: "";

  position: absolute;

  inset: 0;

  background: radial-gradient(
    circle at top right,
    rgba(37, 99, 235, 0.22),
    transparent 35%
  );
}

/* FORM */

.post-job-form {
  position: relative;
  z-index: 2;

  width: 100%;
  max-width: 850px;

  background: rgba(255, 255, 255, 0.94);

  backdrop-filter: blur(18px);

  padding: 3rem;

  border-radius: var(--radius-lg);

  box-shadow: var(--shadow-lg);

  animation: fadeUp 0.7s ease;
}

.post-job-form::before {
  content: "";

  position: absolute;

  width: 220px;
  height: 220px;

  background: rgba(37, 99, 235, 0.05);

  border-radius: 50%;

  top: -90px;
  right: -90px;
}

.post-job-form h1 {
  font-size: 2.5rem;
  font-weight: 700;

  text-align: center;

  margin-bottom: 2rem;

  color: var(--dark-color);

  position: relative;
}

.post-job-form h1::after {
  content: "";

  display: block;

  width: 70px;
  height: 4px;

  margin: 0.7rem auto 0;

  border-radius: 20px;

  background: var(--gradient);
}

/* FORM GROUP */

.form-group {
  margin-bottom: 1.5rem;
}

.form-group label {
  display: block;

  margin-bottom: 0.6rem;

  color: var(--dark-color);

  font-size: 0.95rem;
  font-weight: 600;
}

/* INPUTS */

.form-group input,
.form-group textarea {
  width: 100%;

  padding: 1rem 1.2rem;

  border-radius: 16px;

  border: 1px solid var(--border-color);

  background: #f8fafc;

  font-size: 1rem;

  transition: var(--transition);
}

.form-group input::placeholder,
.form-group textarea::placeholder {
  color: #94a3b8;
}

.form-group textarea {
  min-height: 160px;
  resize: vertical;
}

.form-group input:focus,
.form-group textarea:focus {
  outline: none;

  border-color: var(--primary-color);

  background: white;

  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
}

/* SUBMIT BUTTON */

.submit-btn {
  width: 100%;

  padding: 1rem;

  margin-top: 1rem;

  border: none;

  border-radius: 16px;

  background: var(--gradient);

  color: white;

  font-size: 1rem;
  font-weight: 600;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 0.7rem;

  transition: var(--transition);
}

.submit-btn:hover {
  transform: translateY(-2px);

  box-shadow: 0 15px 30px rgba(37, 99, 235, 0.35);
}

/* FOOTER */

.footer {
  background: var(--dark-color);

  padding: 1.5rem 6%;
}

.footer-content {
  max-width: 1200px;
  margin: auto;
}

.footer-links {
  display: flex;
  justify-content: center;
  gap: 3rem;
}

.footer-links a {
  color: rgba(255, 255, 255, 0.85);

  text-decoration: none;

  font-weight: 500;

  position: relative;

  transition: var(--transition);
}

.footer-links a::after {
  content: "";

  position: absolute;

  left: 0;
  bottom: -5px;

  width: 0%;
  height: 2px;

  background: var(--secondary-color);

  transition: var(--transition);
}

.footer-links a:hover {
  color: white;
}

.footer-links a:hover::after {
  width: 100%;
}

/* ANIMATION */

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(40px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* RESPONSIVE */

@media (max-width: 768px) {
  .post-job-container {
    padding: 7rem 1rem 2rem;
  }

  .post-job-form {
    padding: 2rem;
  }

  .post-job-form h1 {
    font-size: 2rem;
  }

  .footer-links {
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }

  .navbar {
    padding: 1rem;
  }

  .logout-btn {
    padding: 0.7rem 1.4rem;
    font-size: 0.9rem;
  }
}
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">
        <a href="/recruiter/home">
          <img
            src="/assets/favicon.png"
            alt="HireNest Logo"
            style="width: 30px; height: 30px; margin-right: 10px"
          />
          HireNest
        </a>
      </div>
      <a href="/logout" class="logout-btn"
        >Logout <i class="fas fa-sign-out-alt"></i
      ></a>
    </nav>

    <div class="post-job-container">
      <div class="post-job-form">
        <h1>Post New Job</h1>
        <form action="/recruiter/post-job" method="post">
          <div class="form-group">
            <label for="title">Job Role</label>
            <input type="text" name="role" id="title" required />
          </div>
          <div class="form-group">
            <label for="description">Job Description</label>
            <textarea name="description" id="description" required></textarea>
          </div>
          <div class="form-group">
            <label for="skills">Required Skills</label>
            <input type="text" name="skills" id="skills" required />
          </div>
          <div class="form-group">
            <label for="location">Location</label>
            <input type="text" name="location" id="location" required />
          </div>
          <div class="form-group">
            <label for="salary">CTC (Annual in LPA)</label>
            <input type="number" name="ctc" id="salary" required />
          </div>
          <div class="form-group">
            <label for="experience">Required Experience (Months)</label>
            <input type="number" name="experience" id="experience" required />
          </div>
          <button type="submit" class="submit-btn">
            Post Job <i class="fas fa-paper-plane"></i>
          </button>
        </form>
      </div>
    </div>

    <footer class="footer">
      <div class="footer-content">
        <div class="footer-links">
          <a href="/about-us">About Us</a>
          <a href="/privacy-policy">Privacy Policy</a>
          <a href="/terms">Terms of Service</a>
        </div>
      </div>
    </footer>
  </body>
</html>
