<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HireNest - Manage your job listings" />
    <meta
      name="keywords"
      content="job management, recruiter dashboard, job listings"
    />
    <meta name="author" content="HireNest" />
    <meta name="robots" content="index, follow" />

    <link rel="icon" type="image/x-icon" href="/assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <title>HireNest - Manage Jobs</title>

    <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

:root {
  --primary: #2563eb;
  --secondary: #06b6d4;
  --dark: #0f172a;
  --light: #ffffff;
  --gray: #f1f5f9;
  --text: #475569;
  --border: #e2e8f0;

  --gradient: linear-gradient(135deg, #2563eb, #06b6d4);

  --shadow-sm: 0 5px 15px rgba(15, 23, 42, 0.06);
  --shadow-md: 0 15px 35px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 25px 50px rgba(15, 23, 42, 0.15);

  --transition: all 0.3s ease;
}

body {
  background:
    radial-gradient(circle at top left, rgba(37, 99, 235, 0.08), transparent 25%),
    radial-gradient(circle at bottom right, rgba(6, 182, 212, 0.08), transparent 25%),
    #f8fafc;

  min-height: 100vh;

  color: var(--text);

  overflow-x: hidden;
}

/* NAVBAR */

.navbar {
  position: fixed;
  top: 0;
  left: 0;

  width: 100%;

  padding: 1rem 6%;

  display: flex;
  justify-content: space-between;
  align-items: center;

  background: rgba(255, 255, 255, 0.8);

  backdrop-filter: blur(16px);

  border-bottom: 1px solid rgba(255, 255, 255, 0.3);

  z-index: 1000;

  box-shadow: var(--shadow-sm);
}

.logo a {
  text-decoration: none;

  display: flex;
  align-items: center;

  font-size: 2rem;
  font-weight: 700;

  background: var(--gradient);

  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.logo img {
  border-radius: 8px;
}

/* LOGOUT BUTTON */

.logout-btn {
  padding: 0.85rem 1.8rem;

  border-radius: 50px;

  border: 2px solid var(--primary);

  color: var(--primary);

  text-decoration: none;

  font-weight: 600;

  display: flex;
  align-items: center;
  gap: 0.5rem;

  transition: var(--transition);
}

.logout-btn:hover {
  background: var(--gradient);

  color: white;

  border-color: transparent;

  transform: translateY(-2px);

  box-shadow: 0 12px 25px rgba(37, 99, 235, 0.25);
}

/* CONTENT */

.content {
  max-width: 1500px;

  margin: auto;

  padding: 8rem 5% 4rem;
}

/* GRID */

.jobs-grid {
  display: grid;

  grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));

  gap: 2rem;
}

/* CARD */

.job-card {
  position: relative;

  background: rgba(255, 255, 255, 0.78);

  backdrop-filter: blur(18px);

  border-radius: 28px;

  padding: 2rem;

  overflow: hidden;

  border: 1px solid rgba(255, 255, 255, 0.4);

  box-shadow: var(--shadow-md);

  transition: var(--transition);

  display: flex;
  flex-direction: column;

  min-height: 100%;
}

.job-card::before {
  content: "";

  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 6px;

  background: var(--gradient);
}

.job-card:hover {
  transform: translateY(-10px);

  box-shadow: var(--shadow-lg);
}

/* TITLE */

.job-card h3 {
  font-size: 1.55rem;
  font-weight: 700;

  color: var(--dark);

  margin-bottom: 1.6rem;

  padding-bottom: 1rem;

  border-bottom: 1px solid var(--border);

  line-height: 1.4;
}

/* DETAILS */

.job-detail {
  display: flex;
  align-items: flex-start;

  gap: 1rem;

  padding: 1rem;

  margin-bottom: 1rem;

  border-radius: 18px;

  background: rgba(248, 250, 252, 0.9);

  border: 1px solid rgba(226, 232, 240, 0.6);

  transition: var(--transition);
}

.job-detail:hover {
  transform: translateX(5px);

  background: rgba(239, 246, 255, 0.9);

  border-color: rgba(37, 99, 235, 0.15);
}

.job-detail strong {
  min-width: 115px;

  color: var(--dark);

  font-size: 0.95rem;
  font-weight: 600;
}

.job-detail span {
  flex: 1;

  font-size: 0.94rem;

  line-height: 1.6;

  color: var(--text);

  word-break: break-word;
}

/* STATUS */

.status-badge {
  padding: 0.5rem 1rem;

  border-radius: 50px;

  font-size: 0.82rem;
  font-weight: 600;

  text-transform: uppercase;

  letter-spacing: 0.5px;
}

.approved {
  background: rgba(34, 197, 94, 0.12);
  color: #16a34a;
}

.pending {
  background: rgba(239, 68, 68, 0.12);
  color: #dc2626;
}

/* BUTTONS */

.action-buttons {
  display: flex;

  gap: 1rem;

  margin-top: auto;

  padding-top: 1.5rem;
}

.action-btn {
  flex: 1;

  padding: 1rem;

  border-radius: 18px;

  text-decoration: none;

  font-size: 0.95rem;
  font-weight: 600;

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 0.6rem;

  transition: var(--transition);
}

.edit-btn {
  background: var(--gradient);

  color: white;

  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.18);
}

.delete-btn {
  background: linear-gradient(135deg, #ef4444, #dc2626);

  color: white;

  box-shadow: 0 10px 20px rgba(239, 68, 68, 0.16);
}

.action-btn:hover {
  transform: translateY(-3px);

  box-shadow: 0 18px 35px rgba(15, 23, 42, 0.16);
}

/* ALERT */

.alert-message {
  position: fixed;

  top: 100px;
  right: 20px;

  padding: 1rem 1.5rem;

  border-radius: 16px;

  display: flex;
  align-items: center;
  gap: 1rem;

  z-index: 1001;

  animation: slideIn 0.4s ease;

  box-shadow: var(--shadow-md);
}

.success {
  background: #dcfce7;
  color: #166534;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

.alert-close {
  background: none;
  border: none;

  font-size: 1.2rem;

  cursor: pointer;

  color: inherit;
}

/* FOOTER */

.footer {
  margin-top: 4rem;

  background: #0f172a;

  padding: 1.5rem 6%;
}

.footer-links {
  display: flex;
  justify-content: center;

  gap: 3rem;
}

.footer-links a {
  color: rgba(255, 255, 255, 0.8);

  text-decoration: none;

  transition: var(--transition);
}

.footer-links a:hover {
  color: white;
}

/* ANIMATION */

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateX(100%);
  }

  to {
    opacity: 1;
    transform: translateX(0);
  }
}

/* MOBILE */

@media (max-width: 768px) {
  .navbar {
    padding: 1rem;
  }

  .content {
    padding: 7rem 1rem 3rem;
  }

  .jobs-grid {
    grid-template-columns: 1fr;
  }

  .job-card {
    padding: 1.5rem;
  }

  .job-detail {
    flex-direction: column;
    gap: 0.4rem;
  }

  .job-detail strong {
    min-width: auto;
  }

  .action-buttons {
    flex-direction: column;
  }

  .footer-links {
    flex-direction: column;
    align-items: center;

    gap: 1rem;
  }
}
    </style>
  </head>

  <body>
    <div th:if="${session.success}" class="alert-message success">
      <span th:text="${session.success}"></span>
      <button
        class="alert-close"
        onclick="this.parentElement.style.display='none'"
      >
        ×
      </button>
      <th:block th:text="${@messageRemover.remove()}"></th:block>
    </div>
    <div th:if="${session.error}" class="alert-message error">
      <span th:text="${session.error}"></span>
      <button
        class="alert-close"
        onclick="this.parentElement.style.display='none'"
      >
        ×
      </button>
      <th:block th:text="${@messageRemover.remove()}"></th:block>
    </div>

    <nav class="navbar">
      <div class="logo">
        <a href="/recruiter/home">
          <img
            src="/assets/favicon.png"
            alt="HireNest Logo"
            style="width: 30px; height: 30px; margin-right: 10px"
          />
          HireNest
        </a>
      </div>
      <a href="/logout" class="logout-btn"
        >Logout <i class="fas fa-sign-out-alt"></i
      ></a>
    </nav>

    <div class="content">
      <div class="jobs-grid">
        <div class="job-card" th:each="job:${jobs}">
          <h3 th:text="${job.role}">Role</h3>
          <div class="job-detail">
            <strong>Company:</strong>
            <span th:text="${job.recruiter.companyName}"></span>
          </div>
          <div class="job-detail">
            <strong>Package:</strong>
            <span th:text="${job.ctc}+' LPA'"></span>
          </div>
          <div class="job-detail">
            <strong>Description:</strong>
            <span th:text="${job.description}"></span>
          </div>
          <div class="job-detail">
            <strong>Experience:</strong>
            <span th:text="${job.experience}+' months'"></span>
          </div>
          <div class="job-detail">
            <strong>Skills:</strong>
            <span th:text="${job.skills}"></span>
          </div>
          <div class="job-detail">
            <strong>Location:</strong>
            <span th:text="${job.location}"></span>
          </div>
          <div class="job-detail">
            <strong>Status:</strong>
            <span
              class="status-badge"
              th:classappend="${job.approved ? 'approved' : 'pending'}"
              th:text="${job.approved ? 'Approved' : 'Pending'}"
            ></span>
          </div>
          <div class="action-buttons">
            <a
              th:href="'/recruiter/edit-job/'+${job.id}"
              class="action-btn edit-btn"
            >
              <i class="fas fa-edit"></i> Edit
            </a>
            <a
              th:href="'/recruiter/delete-job/'+${job.id}"
              class="action-btn delete-btn"
            >
              <i class="fas fa-trash"></i> Delete
            </a>
          </div>
        </div>
      </div>
    </div>

    <footer class="footer">
      <div class="footer-content">
        <div class="footer-links">
          <a href="/about-us">About Us</a>
          <a href="/privacy-policy">Privacy Policy</a>
          <a href="/terms">Terms of Service</a>
        </div>
      </div>
    </footer>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const alerts = document.querySelectorAll(".alert-message");
        alerts.forEach((alert) => {
          setTimeout(() => {
            alert.style.display = "none";
          }, 2000);
        });
      });
    </script>
  </body>
</html>
