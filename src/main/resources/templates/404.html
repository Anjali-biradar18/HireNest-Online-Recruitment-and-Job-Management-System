<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Page Not Found - HireNest" />

    <link rel="icon" type="image/x-icon" href="/assets/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>404 - Page Not Found</title>

    <style>
      :root {
  --primary-color: #2563eb;
  --secondary-color: #06b6d4;

  --dark-color: #0f172a;
  --light-color: #ffffff;
  --text-color: #64748b;

  --gradient: linear-gradient(135deg, #2563eb, #06b6d4);

  --shadow-sm: 0 10px 25px rgba(15, 23, 42, 0.08);
  --shadow-md: 0 20px 45px rgba(15, 23, 42, 0.12);
  --shadow-lg: 0 30px 60px rgba(37, 99, 235, 0.18);

  --transition: all 0.3s ease;
}

* {
  margin: 0;
  padding: 0;

  box-sizing: border-box;

  font-family: "Poppins", sans-serif;
}

body {
  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;

  overflow: hidden;

  background:
    linear-gradient(
      rgba(15, 23, 42, 0.72),
      rgba(15, 23, 42, 0.72)
    ),
    url("https://images.unsplash.com/photo-1520607162513-77705c0f0d4a?q=80&w=2070&auto=format&fit=crop");

  background-size: cover;
  background-position: center;

  position: relative;
}

/* GLOW EFFECTS */

body::before {
  content: "";

  position: absolute;

  width: 500px;
  height: 500px;

  background: rgba(37, 99, 235, 0.18);

  filter: blur(120px);

  top: -120px;
  left: -120px;

  border-radius: 50%;
}

body::after {
  content: "";

  position: absolute;

  width: 400px;
  height: 400px;

  background: rgba(6, 182, 212, 0.16);

  filter: blur(120px);

  bottom: -100px;
  right: -100px;

  border-radius: 50%;
}

/* CONTAINER */

.error-container {
  position: relative;
  z-index: 2;

  width: 100%;
  max-width: 650px;

  padding: 4rem 3rem;

  border-radius: 36px;

  background: rgba(255, 255, 255, 0.14);

  backdrop-filter: blur(22px);

  border: 1px solid rgba(255, 255, 255, 0.18);

  box-shadow: var(--shadow-lg);

  text-align: center;

  overflow: hidden;

  animation: fadeUp 0.8s ease;
}

.error-container::before {
  content: "";

  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 7px;

  background: var(--gradient);
}

/* ERROR CODE */

.error-code {
  font-size: 10rem;
  font-weight: 800;

  line-height: 1;

  margin-bottom: 1rem;

  background: linear-gradient(135deg, #ffffff, #bfdbfe);

  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;

  text-shadow: 0 15px 35px rgba(255, 255, 255, 0.12);

  animation: float 3s ease-in-out infinite;
}

/* TITLE */

.error-message {
  font-size: 2.2rem;
  font-weight: 700;

  color: white;

  margin-bottom: 1.2rem;

  line-height: 1.4;
}

/* DESCRIPTION */

.error-container p {
  font-size: 1rem;

  color: rgba(255, 255, 255, 0.78);

  margin-bottom: 2.5rem;

  line-height: 1.8;
}

/* BUTTON */

.home-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  padding: 1rem 2.4rem;

  border-radius: 20px;

  background: var(--gradient);

  color: white;

  text-decoration: none;

  font-size: 1rem;
  font-weight: 600;

  transition: var(--transition);

  box-shadow: 0 15px 35px rgba(37, 99, 235, 0.28);
}

.home-btn:hover {
  transform: translateY(-4px);

  box-shadow: 0 22px 45px rgba(37, 99, 235, 0.38);
}

/* ANIMATIONS */

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(40px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes float {
  0% {
    transform: translateY(0px);
  }

  50% {
    transform: translateY(-10px);
  }

  100% {
    transform: translateY(0px);
  }
}

/* RESPONSIVE */

@media (max-width: 768px) {
  .error-container {
    padding: 3rem 1.8rem;

    border-radius: 28px;
  }

  .error-code {
    font-size: 7rem;
  }

  .error-message {
    font-size: 1.7rem;
  }

  .error-container p {
    font-size: 0.95rem;
  }

  .home-btn {
    width: 100%;
  }
}
    </style>
  </head>

  <body>
    <div class="error-container">
      <div class="error-code">404</div>
      <h1 class="error-message">Oops! Page Not Found</h1>
      <p style="margin-bottom: 2rem; color: #666">
        The page you're looking for doesn't exist or has been moved.
      </p>
      <a href="/" class="home-btn">Back to Home</a>
    </div>
  </body>
</html>
