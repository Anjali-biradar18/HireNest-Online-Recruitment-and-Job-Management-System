<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="HireNest - Find your dream job opportunities across various industries"
    />
    <meta
      name="keywords"
      content="jobs, career, employment, job search, job portal, hiring, job opportunities"
    />
    <meta name="author" content="HireNest" />
    <meta name="robots" content="index, follow" />

    <link rel="icon" type="image/x-icon" href="/assets/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <title>HireNest - Find Your Dream Job Today</title>

    <style>
     :root {
  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --secondary: #06b6d4;
  --dark: #0f172a;
  --dark-light: #1e293b;
  --light: #ffffff;
  --gray: #f8fafc;
  --gray-dark: #64748b;
  --border: #e2e8f0;

  --gradient: linear-gradient(135deg, #2563eb, #06b6d4);

  --shadow-sm: 0 4px 10px rgba(15, 23, 42, 0.05);
  --shadow-md: 0 10px 30px rgba(15, 23, 42, 0.1);
  --shadow-lg: 0 20px 50px rgba(15, 23, 42, 0.18);

  --radius-sm: 12px;
  --radius-md: 18px;
  --radius-lg: 28px;

  --transition: all 0.3s ease;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--gray);
  color: var(--dark);
  overflow-x: hidden;
  line-height: 1.6;
}

/* NAVBAR */

.navbar {
  position: fixed;
  top: 0;
  width: 100%;
  padding: 1rem 6%;
  display: flex;
  justify-content: space-between;
  align-items: center;

  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  border-bottom: 1px solid rgba(255, 255, 255, 0.2);

  z-index: 1000;

  box-shadow: var(--shadow-sm);
}

.logo {
  font-size: 2rem;
  font-weight: 700;
  transition: var(--transition);
}

.logo a {
  text-decoration: none;
  display: flex;
  align-items: center;

  background: var(--gradient);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.logo:hover {
  transform: scale(1.03);
}

/* NAV BUTTONS */

.nav-buttons {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.nav-btn {
  padding: 0.85rem 2rem;
  border-radius: 50px;
  border: none;
  cursor: pointer;
  font-size: 0.95rem;
  font-weight: 600;
  transition: var(--transition);
}

.login-btn {
  background: transparent;
  border: 2px solid var(--primary);
  color: var(--primary);
}

.login-btn:hover {
  background: var(--primary);
  color: white;
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(37, 99, 235, 0.25);
}

.register-btn {
  background: var(--gradient);
  color: white;
  box-shadow: 0 10px 25px rgba(37, 99, 235, 0.2);
}

.register-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 35px rgba(37, 99, 235, 0.35);
}

/* HERO */

.hero-section {
  min-height: 100vh;

  background: linear-gradient(
      rgba(15, 23, 42, 0.72),
      rgba(15, 23, 42, 0.72)
    ),
    url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f?q=80&w=2071&auto=format&fit=crop");

  background-size: cover;
  background-position: center;
  background-attachment: fixed;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 7rem 1rem 4rem;

  position: relative;
}

.hero-content {
  width: 100%;
  max-width: 900px;
  text-align: center;

  animation: fadeUp 1s ease;
}

.hero-title {
  color: white;
  font-size: 4.5rem;
  line-height: 1.1;
  font-weight: 800;
  margin-bottom: 1.5rem;

  letter-spacing: -1.5px;
}

.hero-subtitle {
  color: rgba(255, 255, 255, 0.9);

  font-size: 1.2rem;
  max-width: 700px;

  margin: auto;
  margin-bottom: 3rem;
}

/* SEARCH BOX */

.search-box {
  width: 100%;
  max-width: 850px;

  margin: auto;

  background: rgba(255, 255, 255, 0.92);

  backdrop-filter: blur(10px);

  padding: 1rem;

  border-radius: var(--radius-lg);

  display: flex;
  gap: 1rem;

  box-shadow: var(--shadow-lg);
}

.search-input {
  flex: 1;

  border: 1px solid transparent;

  background: var(--gray);

  padding: 1.2rem 1.4rem;

  border-radius: var(--radius-md);

  font-size: 1rem;

  color: var(--dark);

  transition: var(--transition);
}

.search-input::placeholder {
  color: var(--gray-dark);
}

.search-input:focus {
  outline: none;

  border-color: var(--primary);

  background: white;

  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
}

.search-btn {
  border: none;

  padding: 1rem 2.4rem;

  border-radius: var(--radius-md);

  background: var(--gradient);

  color: white;

  font-weight: 600;
  font-size: 1rem;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.7rem;

  transition: var(--transition);
}

.search-btn:hover {
  transform: translateY(-2px);

  box-shadow: 0 12px 30px rgba(37, 99, 235, 0.3);
}

/* ALERTS */

.alert-message {
  position: fixed;

  top: 100px;
  left: 50%;

  transform: translateX(-50%);

  min-width: 340px;

  padding: 1rem 1.4rem;

  border-radius: var(--radius-md);

  display: flex;
  align-items: center;
  gap: 1rem;

  z-index: 9999;

  box-shadow: var(--shadow-md);

  animation: slideDown 0.4s ease;
}

.success {
  background: #dcfce7;
  color: #166534;
  border-left: 5px solid #16a34a;
}

.error {
  background: #fee2e2;
  color: #991b1b;
  border-left: 5px solid #dc2626;
}

.alert-close {
  margin-left: auto;

  background: transparent;
  border: none;

  color: inherit;

  font-size: 1.3rem;

  cursor: pointer;
}

/* FOOTER */

.footer {
  background: var(--dark);
  padding: 2rem 6%;
}

.footer-content {
  max-width: 1200px;
  margin: auto;
}

.footer-links {
  display: flex;
  justify-content: center;
  gap: 3rem;
}

.footer-links a {
  color: rgba(255, 255, 255, 0.85);

  text-decoration: none;

  font-weight: 500;

  position: relative;

  transition: var(--transition);
}

.footer-links a::after {
  content: "";

  position: absolute;

  left: 0;
  bottom: -6px;

  width: 0%;
  height: 2px;

  background: var(--secondary);

  transition: var(--transition);
}

.footer-links a:hover {
  color: white;
}

.footer-links a:hover::after {
  width: 100%;
}

/* ANIMATIONS */

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(35px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translate(-50%, -30px);
  }

  to {
    opacity: 1;
    transform: translate(-50%, 0);
  }
}

/* RESPONSIVE */

@media (max-width: 992px) {
  .hero-title {
    font-size: 3.5rem;
  }
}

@media (max-width: 768px) {
  .navbar {
    padding: 1rem;
  }

  .hero-title {
    font-size: 2.7rem;
  }

  .hero-subtitle {
    font-size: 1rem;
  }

  .search-box {
    flex-direction: column;
    padding: 1rem;
  }

  .search-btn {
    width: 100%;
  }

  .nav-buttons {
    gap: 0.7rem;
  }

  .nav-btn {
    padding: 0.7rem 1.3rem;
    font-size: 0.9rem;
  }

  .footer-links {
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }

  .alert-message {
    width: 90%;
    min-width: unset;
  }
}
    </style>
  </head>

  <body>
    <nav class="navbar">
      <div class="logo">
        <a href="/" style="display: flex; align-items: center">
          <img
            src="/assets/favicon.png"
            alt="HireNest Logo"
            style="width: 30px; height: 30px; margin-right: 10px"
          />
          HireNest
        </a>
      </div>
      <div class="nav-buttons">
        <a href="/login"><button class="nav-btn login-btn">Login</button></a>
        <a href="/jobseeker/register"
          ><button class="nav-btn register-btn">Register</button></a
        >
      </div>
    </nav>

    <div th:if="${session.success}" class="alert-message success">
      <span th:text="${session.success}"></span>
      <button
        class="alert-close"
        onclick="this.parentElement.style.display='none'"
      >
        ×
      </button>
      <th:block th:text="${@messageRemover.remove()}"></th:block>
    </div>
    <div th:if="${session.error}" class="alert-message error">
      <span th:text="${session.error}"></span>
      <button
        class="alert-close"
        onclick="this.parentElement.style.display='none'"
      >
        ×
      </button>
      <th:block th:text="${@messageRemover.remove()}"></th:block>
    </div>

    <section class="hero-section">
      <div class="hero-content">
        <h1 class="hero-title">Find Your Dream Job Today</h1>
        <p class="hero-subtitle">
          Search through thousands of job listings to find your perfect match
        </p>
        <form action="/search-jobs" method="post">
          <div class="search-box">
            <input
              type="text"
              class="search-input"
              name="query"
              placeholder="Search jobs..."
              required
            />
            <button type="submit" class="search-btn">
              <i class="fas fa-search"></i>
              Search
            </button>
          </div>
        </form>
      </div>
    </section>

    <footer class="footer">
      <div class="footer-content">
        <div class="footer-links">
          <a href="/about-us">About Us</a>
          <a href="/privacy-policy">Privacy Policy</a>
          <a href="/terms">Terms of Service</a>
        </div>
      </div>
    </footer>
    <script>
      setTimeout(function () {
        const alertMessages = document.querySelectorAll(".alert-message");
        alertMessages.forEach((message) => {
          message.style.display = "none";
        });
      }, 2000);
    </script>
  </body>
</html>
