<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HireNest - Complete Your Profile" />
    <meta
      name="keywords"
      content="job profile, career profile, professional profile"
    />
    <meta name="author" content="HireNest" />
    <meta name="robots" content="index, follow" />

    <link rel="icon" type="image/x-icon" href="/assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <title>HireNest - Complete Profile</title>

    <style>
      :root {
  --primary-color: #2563eb;
  --secondary-color: #06b6d4;

  --dark-color: #0f172a;
  --light-color: #ffffff;
  --text-color: #475569;
  --border-color: #e2e8f0;

  --gradient: linear-gradient(135deg, #2563eb, #06b6d4);

  --shadow-sm: 0 8px 20px rgba(15, 23, 42, 0.06);
  --shadow-md: 0 20px 45px rgba(15, 23, 42, 0.1);
  --shadow-lg: 0 30px 60px rgba(15, 23, 42, 0.16);

  --transition: all 0.3s ease;
}

* {
  margin: 0;
  padding: 0;

  box-sizing: border-box;

  font-family: "Poppins", sans-serif;
}

body {
  min-height: 100vh;

  display: flex;
  flex-direction: column;

  overflow-x: hidden;

  background:
    radial-gradient(circle at top left, rgba(37, 99, 235, 0.08), transparent 25%),
    radial-gradient(circle at bottom right, rgba(6, 182, 212, 0.08), transparent 25%),
    #f8fafc;

  color: var(--text-color);
}

/* NAVBAR */

.navbar {
  position: fixed;

  top: 0;
  left: 0;

  width: 100%;

  padding: 1rem 6%;

  display: flex;
  justify-content: space-between;
  align-items: center;

  background: rgba(255, 255, 255, 0.75);

  backdrop-filter: blur(18px);

  border-bottom: 1px solid rgba(255, 255, 255, 0.3);

  z-index: 1000;

  box-shadow: var(--shadow-sm);
}

.logo {
  font-size: 2rem;
  font-weight: 700;
}

.logo a {
  text-decoration: none;

  display: flex;
  align-items: center;

  background: var(--gradient);

  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.logo img {
  border-radius: 8px;
}

/* LOGOUT BUTTON */

.logout-btn {
  padding: 0.85rem 1.8rem;

  border-radius: 50px;

  border: 2px solid var(--primary-color);

  color: var(--primary-color);

  text-decoration: none;

  font-weight: 600;

  display: flex;
  align-items: center;
  gap: 0.5rem;

  transition: var(--transition);
}

.logout-btn:hover {
  background: var(--gradient);

  color: white;

  border-color: transparent;

  transform: translateY(-2px);

  box-shadow: 0 12px 25px rgba(37, 99, 235, 0.22);
}

/* CONTENT */

.content {
  flex: 1;

  width: 100%;
  max-width: 1000px;

  margin: auto;

  padding: 8rem 5% 4rem;
}

/* TITLE */

.page-title {
  text-align: center;

  font-size: 3rem;
  font-weight: 700;

  margin-bottom: 3rem;

  background: var(--gradient);

  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* SECTION */

.profile-section {
  position: relative;

  background: rgba(255, 255, 255, 0.78);

  backdrop-filter: blur(20px);

  border-radius: 30px;

  padding: 2.2rem;

  margin-bottom: 2rem;

  overflow: hidden;

  border: 1px solid rgba(255, 255, 255, 0.35);

  box-shadow: var(--shadow-md);

  transition: var(--transition);
}

.profile-section::before {
  content: "";

  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 6px;

  background: var(--gradient);
}

.profile-section:hover {
  transform: translateY(-5px);

  box-shadow: var(--shadow-lg);
}

/* SECTION TITLE */

.section-title {
  display: flex;
  align-items: center;

  gap: 0.7rem;

  font-size: 1.5rem;
  font-weight: 700;

  color: var(--dark-color);

  margin-bottom: 2rem;

  padding-bottom: 1rem;

  border-bottom: 1px solid rgba(226, 232, 240, 0.8);
}

.section-title i {
  color: var(--primary-color);
}

/* FORM */

.form-group {
  margin-bottom: 1.5rem;
}

.form-label {
  display: block;

  margin-bottom: 0.7rem;

  color: var(--dark-color);

  font-size: 0.95rem;
  font-weight: 600;
}

/* INPUTS */

.form-control {
  width: 100%;

  padding: 1rem 1.2rem;

  border-radius: 18px;

  border: 1px solid rgba(226, 232, 240, 0.8);

  background: rgba(248, 250, 252, 0.9);

  color: var(--dark-color);

  font-size: 1rem;

  transition: var(--transition);
}

.form-control:focus {
  outline: none;

  border-color: rgba(37, 99, 235, 0.3);

  background: white;

  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
}

textarea.form-control {
  resize: vertical;
  min-height: 120px;
}

/* GRID */

.row {
  display: grid;

  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));

  gap: 1.5rem;
}

/* CHECKBOX */

.fresher-check {
  display: flex;
  align-items: center;

  gap: 0.8rem;

  margin-bottom: 1.5rem;

  font-size: 1rem;
  font-weight: 500;

  color: var(--dark-color);
}

.fresher-check input {
  width: 18px;
  height: 18px;

  accent-color: var(--primary-color);
}

/* FILE INPUT */

input[type="file"] {
  padding: 0.9rem;

  cursor: pointer;
}

/* SUBMIT BUTTON */

.submit-btn {
  width: 100%;

  padding: 1.1rem;

  border: none;

  border-radius: 20px;

  background: var(--gradient);

  color: white;

  font-size: 1rem;
  font-weight: 600;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 0.7rem;

  transition: var(--transition);

  box-shadow: 0 12px 24px rgba(37, 99, 235, 0.18);
}

.submit-btn:hover {
  transform: translateY(-3px);

  box-shadow: 0 18px 35px rgba(15, 23, 42, 0.16);
}

/* RESPONSIVE */

@media (max-width: 768px) {
  .navbar {
    padding: 1rem;
  }

  .content {
    padding: 7rem 1rem 3rem;
  }

  .page-title {
    font-size: 2.2rem;
  }

  .profile-section {
    padding: 1.7rem;
  }

  .row {
    grid-template-columns: 1fr;
  }
}
    </style>
  </head>

  <body>
    <nav class="navbar">
      <div class="logo">
        <a href="/jobseeker/home">
          <img
            src="/assets/favicon.png"
            alt="HireNest Logo"
            style="width: 30px; height: 30px; margin-right: 10px"
          />
          HireNest
        </a>
      </div>
      <a href="/logout" class="logout-btn"
        >Logout <i class="fas fa-sign-out-alt"></i
      ></a>
    </nav>
    <div class="content">
      <h1 class="page-title">Complete Your Profile</h1>

      <form
        action="/jobseeker/complete-profile"
        method="post"
        enctype="multipart/form-data"
      >
        <div class="profile-section">
          <h2 class="section-title">
            <i class="fas fa-graduation-cap"></i> Education Details
          </h2>
          <div class="form-group">
            <label class="form-label">Degree</label>
            <input type="text" class="form-control" name="degree" required />
          </div>
          <div class="form-group">
            <label class="form-label">Institution</label>
            <input
              type="text"
              class="form-control"
              name="institution"
              required
            />
          </div>
          <div class="row">
            <div class="form-group">
              <label class="form-label">Start Date</label>
              <input
                type="date"
                class="form-control"
                name="eduStartDate"
                required
              />
            </div>
            <div class="form-group">
              <label class="form-label">End Date</label>
              <input
                type="date"
                class="form-control"
                name="eduEndDate"
                required
              />
            </div>
          </div>
        </div>

        <div class="profile-section">
          <h2 class="section-title">
            <i class="fas fa-briefcase"></i> Work Experience
          </h2>
          <div class="fresher-check">
            <input type="checkbox" id="isFresher" name="isFresher" />
            <label for="isFresher">I am a fresher</label>
          </div>
          <div id="experienceForm">
            <div class="form-group">
              <label class="form-label">Company Name</label>
              <input type="text" class="form-control" name="company" />
            </div>
            <div class="form-group">
              <label class="form-label">Position</label>
              <input type="text" class="form-control" name="position" />
            </div>
            <div class="row">
              <div class="form-group">
                <label class="form-label">Start Date</label>
                <input type="date" class="form-control" name="expStartDate" />
              </div>
              <div class="form-group">
                <label class="form-label">End Date</label>
                <input type="date" class="form-control" name="expEndDate" />
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Job Description</label>
              <textarea
                class="form-control"
                name="jobDescription"
                rows="3"
              ></textarea>
            </div>
          </div>
        </div>

        <div class="profile-section">
          <h2 class="section-title"><i class="fas fa-file-alt"></i> Resume</h2>
          <div class="form-group">
            <label class="form-label">Upload Resume (PDF only)</label>
            <input
              type="file"
              class="form-control"
              name="resume"
              accept=".pdf"
              required
            />
          </div>
        </div>

        <div class="profile-section">
          <h2 class="section-title">
            <i class="fas fa-user-circle"></i> Profile Image
          </h2>
          <div class="form-group">
            <label class="form-label">Upload Profile Picture (JPG/PNG)</label>
            <input
              type="file"
              class="form-control"
              name="profilePic"
              accept=".jpg,.jpeg,.png"
              required
            />
          </div>
        </div>

        <button type="submit" class="submit-btn">
          <i class="fas fa-check-circle"></i> Complete Profile
        </button>
      </form>
    </div>

    <script>
      document
        .getElementById("isFresher")
        .addEventListener("change", function () {
          document.getElementById("experienceForm").style.display = this.checked
            ? "none"
            : "block";
        });
    </script>
  </body>
</html>
